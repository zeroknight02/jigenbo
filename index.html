<script>
/* 启动自检：app.js 没加载成功（网络断、缓存损坏）时给出自救面板 */
(function () {
  var shown = false;

  function panel() {
    if (shown || window.__BOOT_OK) return;
    shown = true;
    if (document.getElementById('boot-fix')) return;

    var box = document.createElement('div');
    box.id = 'boot-fix';
    box.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;z-index:99999;' +
      'background:#FAF7FF;color:#2B2440;box-sizing:border-box;padding:60px 26px;text-align:center;' +
      'font:15px/1.75 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;';
    box.innerHTML =
      '<div style="font-size:19px;font-weight:600;margin-bottom:12px">页面没加载完整</div>' +
      '<div style="font-size:14px;color:#6B6280;margin-bottom:28px">' +
      '多半是网络中断或本地缓存损坏。<br>先点「重试」；还不行再点「清除缓存重试」。<br>' +
      '你的记录存在本机，清缓存不会删除数据。</div>' +
      '<button id="boot-retry" style="display:block;width:100%;max-width:320px;margin:0 auto 12px;' +
      'padding:13px 0;border:0;border-radius:14px;background:#7C5CFA;color:#fff;font-size:16px;' +
      'font-family:inherit;font-weight:600">重试</button>' +
      '<button id="boot-clear" style="display:block;width:100%;max-width:320px;margin:0 auto;' +
      'padding:13px 0;border:1px solid #D9D2EE;border-radius:14px;background:#fff;color:#5B5372;' +
      'font-size:16px;font-family:inherit">清除缓存重试</button>';
    document.body.appendChild(box);

    document.getElementById('boot-retry').addEventListener('click', function () {
      location.reload();
    });

    document.getElementById('boot-clear').addEventListener('click', function () {
      var btn = this;
      btn.disabled = true;
      btn.textContent = '正在清理…';
      var jobs = [];
      if (window.caches) {
        jobs.push(caches.keys().then(function (keys) {
          return Promise.all(keys.map(function (k) { return caches.delete(k); }));
        }));
      }
      if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
        jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) {
          return Promise.all(rs.map(function (r) { return r.unregister(); }));
        }));
      }
      Promise.all(jobs).catch(function () {}).then(function () {
        location.reload();
      });
    });
  }

  window.__bootFailed = panel;

  /* app.js 加载失败立即提示 */
  window.addEventListener('error', function (e) {
    var t = e.target;
    if (t && t.tagName === 'SCRIPT' && t.src && t.src.indexOf('app.js') >= 0) panel();
  }, true);

  /* 兜底：10 秒还没启动起来也提示 */
  setTimeout(function () { if (!window.__BOOT_OK) panel(); }, 10000);
})();
</script>
<script src="app.js"></script>
